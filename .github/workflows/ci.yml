name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  duplication:
    name: Duplication limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select Node.js and restore npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install duplication detector
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Reject new production duplication
        run: npm run duplication:ci

  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install declared uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version-file: pyproject.toml
          python-version: "3.14.7"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --locked
      - name: Check generated visitor guide
        run: uv run --locked python -m docs.how_it_works.render --check
      - name: Check generated replacement code
        run: uv run --locked python -m codegen.replacement_records --check
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type-check
        run: uv run --locked pyrefly check
      - name: Check strict type coverage
        run: uv run --locked pyrefly coverage check src --strict --fail-under 100
      - name: Test with branch coverage
        run: |
          uv run --locked coverage run -m unittest discover -v
          uv run --locked coverage report
      - name: Validate plugin and skill metadata
        run: uv run --locked python scripts/validate-metadata.py
      - name: Validate Claude plugin and marketplace manifests
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json --strict
          npx --yes @anthropic-ai/claude-code plugin validate . --strict
      - name: Build without workspace sources
        run: uv build --no-sources
      - name: Smoke-test the installed wheel in isolation
        run: |
          uv run --isolated --no-project --with ./dist/*.whl pinboard --version
          uv run --isolated --no-project --with ./dist/*.whl pinboard --help
          uv run --isolated --no-project --with ./dist/*.whl python -m pinboard --version
          smoke_repository=$(mktemp -d)
          git -C "$smoke_repository" init
          uv run --isolated --no-project --with ./dist/*.whl pinboard --project-root "$smoke_repository" init
          test -f "$smoke_repository/.codex/pinboard/state.sqlite3"
          git -C "$smoke_repository" check-ignore -q .codex/pinboard/state.sqlite3
