name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.group }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Linux runs every group. macOS skips the platform-independent repository and type checks and runs the
      # platform-contract test modules on pull requests, keeping the full test suite for main-branch updates.
      matrix:
        include:
          - { os: ubuntu-latest, group: verify-repo }
          - { os: ubuntu-latest, group: verify-types }
          - { os: ubuntu-latest, group: verify-tests }
          - { os: ubuntu-latest, group: verify-package }
          - { os: macos-latest, group: "${{ github.event_name == 'push' && 'verify-tests' || 'verify-platform' }}" }
          - { os: macos-latest, group: verify-package }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ matrix.group == 'verify-repo' && '0' || '1' }}
      - name: Select Node.js and restore npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install declared uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version-file: pyproject.toml
          python-version: "3.14.10"
          enable-cache: true
      - name: Prepare repository worktree
        run: scripts/prepare-worktree
      - name: Run shared verification group
        run: uv run --locked python -m scripts.verify ${{ matrix.group }}
      - name: Preserve raw native duplication evidence in the job log
        if: always() && matrix.group == 'verify-repo'
        run: cat .codex/audits/duplication/jscpd-report.json
