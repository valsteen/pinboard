  <title id="title">Ambiguity closes around one accepted brief</title>
  <desc id="description">Structured intake and discussion become a reviewed, accepted brief. That exact brief anchors implementation and independent candidate review. Implementation defects return to the same attempt; discoveries outside delegated product or architecture authority return to a human and revise the agreement before work resumes.</desc>
