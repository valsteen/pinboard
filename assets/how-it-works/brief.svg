<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 1040">
  <title id="title">The canonical work brief turns one accepted decision into structured implementation and review attention</title>
  <desc id="description">A document-anatomy view of the canonical work brief. Artifact identity and accepted-scope identity anchor the whole-work definition. A cross-boundary checkpoint then names its boundary and outcome before expanding into acceptance criteria, architecture impact, reviewed authorities, contracts, coverage, lifecycle distinctions, verification, and deferrals. Static discovery provides complete unresolved starters without choosing their meaning. Humans and language models interpret those named relationships, while Pinboard code validates the completed envelope and stable artifact identity.</desc>
