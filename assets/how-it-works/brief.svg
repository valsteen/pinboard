  <text x="28" y="42" class="section-label canvas-text">CANONICAL WORK BRIEF</text><text x="28" y="64" class="section-subtitle canvas-text">one strict hierarchy travels with implementation, review, and resume</text><text x="28" y="192" class="section-label canvas-text">ANCHOR THE WHOLE JOB</text><text x="28" y="214" class="section-subtitle canvas-text">identity, accepted scope, and the complete work definition</text><text x="28" y="390" class="section-label canvas-text">CHECKPOINT</text><text x="28" y="412" class="section-subtitle canvas-text">one reviewable boundary expands into explicit reasoning obligations</text><text x="28" y="868" class="section-label canvas-text">THE SCHEMA DISCIPLINES ATTENTION</text><text x="28" y="890" class="section-subtitle canvas-text">the structure is enforced; the meaning still requires judgment</text><text x="416" y="92" class="box-label">PINBOARD-WORK-BRIEF/V2</text><text x="416" y="119" class="box-title">One accepted artifact</text><text x="416" y="140" class="box-body">unresolved starter → completed brief</text><text x="416" y="161" class="box-meta">WorkBriefContract · WorkBrief</text><text x="51" y="242" class="box-label">IDENTITY + VERSIONING</text><text x="51" y="269" class="box-title">Which exact artifact is this?</text><text x="51" y="290" class="box-body">item · attempt · owner</text><text x="51" y="311" class="box-body">revision · base · branch</text><text x="51" y="351" class="box-meta">schema · title</text><text x="371" y="242" class="box-label">ACCEPTED SCOPE REFERENCE</text><text x="371" y="269" class="box-title">Which decision was accepted?</text><text x="371" y="290" class="box-body">revision + digest</text><text x="371" y="351" class="box-meta">accepted_scope</text><text x="671" y="242" class="box-label">OVERALL WORK DEFINITION</text><text x="671" y="269" class="box-title">What is the whole job?</text><text x="671" y="290" class="box-body">outcome · scope · non-goals</text><text x="671" y="311" class="box-body">compatibility · roots · provenance</text><text x="671" y="332" class="box-body">testing · bootstrap · remaining work</text><text x="671" y="351" class="box-meta">definition-bound semantics</text><text x="51" y="440" class="box-label">CHECKPOINT IDENTITY + BOUNDARY</text><text x="51" y="467" class="box-title">What can be built and reviewed together?</text><text x="51" y="488" class="box-body">checkpoint id · title · boundary</text><text x="51" y="509" class="box-body">outcome + outcome description</text><text x="51" y="529" class="box-meta">CrossBoundaryCheckpoint</text><text x="51" y="575" class="box-label">ACCEPTANCE CRITERIA</text><text x="51" y="602" class="box-title">What earns acceptance?</text><text x="51" y="623" class="box-body">numbered requirements</text><text x="51" y="659" class="box-meta">number · requirement</text><text x="336" y="575" class="box-label">ARCHITECTURE IMPACT</text><text x="336" y="602" class="box-title">Is architecture affected?</text><text x="336" y="623" class="box-body">reason + exact selector</text><text x="336" y="659" class="box-meta">kind · reason · selector</text><text x="621" y="575" class="box-label">REVIEWED AUTHORITIES</text><text x="621" y="602" class="box-title">Which sources were examined?</text><text x="621" y="623" class="box-body">identity · selector · digest</text><text x="621" y="659" class="box-meta">families[]</text><text x="906" y="575" class="box-label">CONTRACTS</text><text x="906" y="602" class="box-title">What must remain true?</text><text x="906" y="623" class="box-body">authority → consumer</text><text x="906" y="644" class="box-body">invariant · failure · revalidation</text><text x="906" y="659" class="box-meta">verification · authorization basis</text><text x="51" y="725" class="box-label">COVERAGE</text><text x="51" y="752" class="box-title">Who owns each distinction?</text><text x="51" y="773" class="box-body">consumer + counterexample</text><text x="51" y="809" class="box-meta">criterion · contract · deferral</text><text x="336" y="725" class="box-label">LIFECYCLE PARTITION</text><text x="336" y="752" class="box-title">Which sibling is illegal?</text><text x="336" y="773" class="box-body">operation · source · authority</text><text x="336" y="794" class="box-body">effects + evidence</text><text x="336" y="809" class="box-meta">illegal_sibling</text><text x="621" y="725" class="box-label">VERIFICATION</text><text x="621" y="752" class="box-title">How is each obligation proved?</text><text x="621" y="773" class="box-body">obligation + authorization</text><text x="621" y="809" class="box-meta">accepted scope or authority</text><text x="906" y="725" class="box-label">DEFERRALS</text><text x="906" y="752" class="box-title">What remains outside?</text><text x="906" y="773" class="box-body">why it waits</text><text x="906" y="809" class="box-meta">deferral id · reopen when</text><text x="51" y="922" class="box-label">HUMAN + LLM RESPONSIBILITY</text><text x="51" y="949" class="box-title">Interpret what the work means</text><text x="51" y="970" class="box-body">labels + hierarchy guide attention</text><text x="51" y="991" class="box-meta">semantic judgment</text><text x="631" y="922" class="box-label">PINBOARD TOOL + CODE RESPONSIBILITY</text><text x="631" y="949" class="box-title">Guide and verify the envelope</text><text x="631" y="970" class="box-body">starter · schema · decode · cross-check</text><text x="631" y="991" class="box-meta">canonicalize · bind bytes</text><text x="600" y="1022" text-anchor="middle" font-size="12" class="note-meta canvas-text">THE SAME NAMED RELATIONSHIPS STEER IMPLEMENTATION · REVIEW · CORRECTION · RESUME</text>
