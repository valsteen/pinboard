  <text x="28" y="42" class="section-label canvas-text">PROPOSALS</text><text x="28" y="64" class="section-subtitle canvas-text">original intake facts plus later disposition</text><text x="424" y="42" class="section-label canvas-text">CURRENT WORK</text><text x="424" y="64" class="section-subtitle canvas-text">identity that survives execution</text><text x="824" y="42" class="section-label canvas-text">DEFINITIONS + RELATIONSHIPS</text><text x="824" y="64" class="section-subtitle canvas-text">accepted intent and dependency</text><text x="28" y="432" class="section-label canvas-text">ACCEPTED FILES</text><text x="28" y="454" class="section-subtitle canvas-text">briefs · ready reviews · checkpoint evidence</text><text x="424" y="432" class="section-label canvas-text">MUTATION OWNERSHIP</text><text x="424" y="454" class="section-subtitle canvas-text">ready preparation · active attempts</text><text x="824" y="432" class="section-label canvas-text">INTEGRITY + TIME</text><text x="824" y="454" class="section-subtitle canvas-text">current revision and committed receipts</text><text x="350" y="143" text-anchor="middle" class="connector-label canvas-text">RELATION / TARGET</text><text x="605" y="143" text-anchor="middle" class="connector-label canvas-text">EXECUTES</text><text x="805" y="143" text-anchor="middle" class="connector-label canvas-text">DEFINITION</text><text x="72" y="226" text-anchor="middle" class="connector-label canvas-text">SUPPORTS</text><text x="310" y="226" text-anchor="middle" class="connector-label canvas-text">RECHECK</text><text x="715" y="638" text-anchor="middle" class="connector-label canvas-text">SAME FENCING PATTERN</text><text x="1017" y="620" text-anchor="middle" class="connector-label canvas-text">EACH REVISION</text><text x="106" y="138" class="box-title">Proposal facts</text><text x="106" y="159" class="box-body">same-id intake work</text><text x="106" y="186" class="box-meta">later disposition</text><text x="56" y="288" class="box-title">Evidence</text><text x="56" y="309" class="box-body">why it was raised</text><text x="56" y="336" class="box-meta">proposal_evidence</text><text x="226" y="288" class="box-title">Assumptions</text><text x="226" y="309" class="box-body">facts to recheck</text><text x="226" y="336" class="box-meta">proposal_freshness</text><text x="446" y="138" class="box-title">Work items</text><text x="446" y="159" class="box-body">durable identity</text><text x="446" y="186" class="box-meta">work_items</text><text x="656" y="138" class="box-title">Attempts</text><text x="656" y="159" class="box-body">one execution</text><text x="656" y="186" class="box-meta">attempts</text><text x="846" y="138" class="box-title">Accepted versions</text><text x="846" y="159" class="box-body">current definition</text><text x="846" y="186" class="box-meta">plus its history</text><text x="1036" y="138" class="box-title">Dependencies</text><text x="1036" y="159" class="box-body">item → prerequisite</text><text x="1036" y="186" class="box-meta">item_dependencies</text><text x="66" y="528" class="box-title">Accepted artifacts</text><text x="66" y="549" class="box-body">requirements · brief · result</text><text x="66" y="570" class="box-body">ready + checkpoint review evidence</text><text x="66" y="636" class="box-meta">artifact_refs</text><text x="616" y="528" class="box-title">Attempt authority</text><text x="616" y="549" class="box-body">worker owns attempt</text><text x="616" y="570" class="box-body">fenced generations</text><text x="616" y="606" class="box-meta">attempt_lease_*</text><text x="426" y="678" class="box-title">Preparation authority</text><text x="426" y="699" class="box-body">ready item + definition pin</text><text x="426" y="720" class="box-body">counter · identities · current lease</text><text x="426" y="736" class="box-meta">preparation_lease_*</text><text x="916" y="528" class="box-title">Project state</text><text x="916" y="549" class="box-body">revision + host epoch</text><text x="916" y="576" class="box-meta">project_meta</text><text x="906" y="678" class="box-title">Committed history</text><text x="906" y="699" class="box-body">input + outcome + actor</text><text x="906" y="726" class="box-meta">transition_history</text><text x="28" y="790" text-anchor="start" font-size="12" class="note-meta canvas-text">SELECTED RELATIONSHIPS SHOWN · EVERY FOREIGN KEY STILL CHECKED BY THE SEED</text><text x="28" y="816" text-anchor="start" font-size="12" class="note canvas-text">Briefs and accepted results link to attempts. Ready-review evidence is reused by exact identity. Accepted checkpoint review evidence links to history.</text><text x="28" y="834" text-anchor="start" font-size="12" class="note canvas-text">Preparation and attempt authority are item-scoped; project actions rely on SQLite transactions.</text>
