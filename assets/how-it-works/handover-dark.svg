  <text x="28" y="54" class="section-label canvas-text">PINBOARD AUTHORITY</text><text x="28" y="76" class="section-subtitle canvas-text">project facts and accepted evidence</text><text x="420" y="54" class="section-label canvas-text">READ-ONLY HANDOVER</text><text x="420" y="76" class="section-subtitle canvas-text">complete before any output</text><text x="760" y="54" class="section-label canvas-text">PORTABLE BOUNDARY</text><text x="760" y="76" class="section-subtitle canvas-text">the recipient owns the next step</text><text x="360" y="186" text-anchor="middle" class="connector-label canvas-text">READ ONCE</text><text x="330" y="338" text-anchor="middle" class="connector-label canvas-text">VERIFY</text><text x="705" y="221" text-anchor="middle" class="connector-label canvas-text">THEN EMIT</text><text x="990" y="221" text-anchor="middle" class="connector-label canvas-text">USE</text><text x="66" y="142" class="box-label">ONE STORED REVISION</text><text x="66" y="169" class="box-title">SQLite ledger</text><text x="66" y="190" class="box-body">work · proposals · decisions</text><text x="66" y="211" class="box-body">relationships · history</text><text x="66" y="226" class="box-meta">StoredWorkState</text><text x="66" y="362" class="box-label">ACCEPTED EVIDENCE</text><text x="66" y="389" class="box-title">Immutable artifacts</text><text x="66" y="410" class="box-body">briefs · results · reviews</text><text x="66" y="426" class="box-meta">verified exact bytes</text><text x="436" y="192" class="box-label">READ-ONLY COMMAND</text><text x="436" y="219" class="box-title">Build exported package</text><text x="436" y="240" class="box-body">project facts from revision</text><text x="436" y="261" class="box-body">verify + encode artifacts</text><text x="436" y="286" class="box-meta">pinboard handover --json</text><text x="756" y="192" class="box-label">PORTABLE OUTPUT</text><text x="756" y="219" class="box-title">One JSON package</text><text x="756" y="240" class="box-body">revision-stamped</text><text x="756" y="261" class="box-body">tool-neutral</text><text x="756" y="286" class="box-meta">pinboard-project-handover/v2</text><text x="1026" y="192" class="box-label">USER-SELECTED</text><text x="1026" y="219" class="box-title">Team tool</text><text x="1026" y="240" class="box-body">human or LLM maps</text><text x="1026" y="261" class="box-body">the exported package</text><text x="600" y="505" text-anchor="middle" font-size="12" class="note-meta canvas-text">LIVE AUTHORITY NOT EXPORTED · NO LIFECYCLE CHANGE · NO REMOTE WRITE · NO TOOL CHOSEN BY PINBOARD</text>
