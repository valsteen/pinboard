<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 560">
  <title id="title">One project-facts package crosses a read-only boundary</title>
  <desc id="description">The handover command captures one SQLite revision, projects the supported project facts, verifies every referenced accepted artifact, and emits one revision-stamped portable JSON package. Live preparation and attempt authority stay local. A human or another tool decides how to use the package; export changes no Pinboard state and writes to no receiving system.</desc>
