  <title id="title">One change tells one ordered story</title>
  <desc id="description">An ordinary preparation start is decoded, samples its operation time, selects the current definition and initial acquisition or inactive transfer against locked state, commits the targeted mutation atomically, then refreshes repairable views and presents the exact committed claim.</desc>
