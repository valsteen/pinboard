  <text x="28" y="42" class="section-label canvas-text">PACKAGE DEPENDENCY DIRECTION</text><text x="28" y="64" class="section-subtitle canvas-text">every arrow means: may depend on</text><text x="824" y="330" class="section-label canvas-text">DECISION CENTER</text><text x="824" y="352" class="section-subtitle canvas-text">policy remains independent</text><text x="824" y="368" class="section-subtitle canvas-text">of interfaces and storage</text><text x="405" y="151" text-anchor="middle" class="connector-label canvas-text">OPERATIONS</text><text x="795" y="151" text-anchor="middle" class="connector-label canvas-text">DECISIONS</text><text x="305" y="456" text-anchor="middle" class="connector-label canvas-text">COMPOSITION</text><text x="626" y="322" text-anchor="middle" class="connector-label canvas-text">PORTS</text><text x="870" y="456" text-anchor="middle" class="connector-label canvas-text">VALUES</text><text x="76" y="122" class="box-label">INTERFACES</text><text x="76" y="149" class="box-title">Make the request exact</text><text x="76" y="170" class="box-body">small exhaustive route</text><text x="76" y="191" class="box-body">thematic composition · setup context</text><text x="76" y="206" class="box-meta">src/pinboard/interfaces</text><text x="466" y="122" class="box-label">APPLICATION</text><text x="466" y="149" class="box-title">Make the operation coherent</text><text x="466" y="170" class="box-body">exact facts or full state · mutations</text><text x="466" y="191" class="box-body">own storage capability ports</text><text x="466" y="206" class="box-meta">src/pinboard/application</text><text x="856" y="122" class="box-label">DOMAIN</text><text x="856" y="149" class="box-title">Make the change legal</text><text x="856" y="170" class="box-body">pure values and decisions</text><text x="856" y="191" class="box-body">accepted change or rejection</text><text x="856" y="206" class="box-meta">src/pinboard/domain</text><text x="466" y="432" class="box-label">ADAPTERS</text><text x="466" y="459" class="box-title">Persist accepted facts</text><text x="466" y="480" class="box-body">SQLite and filesystem mechanics</text><text x="466" y="501" class="box-body">implement application ports</text><text x="466" y="516" class="box-meta">src/pinboard/adapters</text><text x="28" y="690" text-anchor="start" font-size="12" class="note canvas-text">Runtime data flow appears in the next view. The interface root only routes; thematic interface modules own concrete composition.</text>
