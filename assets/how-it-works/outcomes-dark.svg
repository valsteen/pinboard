or rejection</text><text x="826" y="186" class="box-meta">decide_preparation_authority</text><text x="1126" y="112" class="box-label">ADAPTER EFFECT</text><text x="1126" y="139" class="box-title">Attempt the accepted mutation</text><text x="1126" y="160" class="box-body">commit, stale guard, or fault</text><text x="1126" y="186" class="box-meta">WorkTransaction.commit</text><text x="536" y="382" class="box-label">DOMAIN OUTCOME</text><text x="536" y="409" class="box-title">Return an expected rejection</text><text x="536" y="430" class="box-body">code · message</text><text x="536" y="451" class="box-body">optional FailureDetails</text><text x="536" y="472" class="box-body">this path: details = None</text><text x="536" y="526" class="box-meta">DecisionFailure</text><text x="1056" y="382" class="box-label">ATTEMPTED EFFECT</text><text x="1056" y="409" class="box-title">Report the actual outcome</text><text x="1056" y="430" class="box-body">commit → CommittedEffect</text><text x="1056" y="451" class="box-body">stale guard → DecisionFailure</text><text x="1056" y="472" class="box-body">fault → infrastructure exception</text><text x="1056" y="526" class="box-meta">view warning remains separate</text><text x="661" y="672" class="box-label">INTERFACE PRESENTATION</text><text x="661" y="699" class="box-title">Translate facts into guidance</text><text x="661" y="720" class="box-body">facts → observations · mismatches</text><text x="661" y="741" class="box-body">effect → state · surfaces · retry</text><text x="661" y="762" class="box-body">alternatives → bounded actions</text><text x="661" y="776" class="box-meta">RejectedOperationView · lease output</text><text x="700" y="805" text-anchor="middle" font-size="12" class="note canvas-text">No lower layer chooses wording or invents a follow-up.</text>
