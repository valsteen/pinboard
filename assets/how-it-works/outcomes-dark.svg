  <title id="title">Precise outcomes cross intact layer boundaries</title>
  <desc id="description">A preparation start crosses stable interface, application, domain, and adapter boundaries. Accepted decisions, expected rejections, attempted effects, infrastructure failures, and later view warnings keep their distinct facts. The interface alone turns those facts into presentation and bounded follow-ups.</desc>
