  <text x="28" y="42" class="section-label canvas-text">PREPARATION START</text><text x="28" y="64" class="section-subtitle canvas-text">one request moves from selected facts to an attempted effect</text><text x="28" y="330" class="section-label canvas-text">QUALIFIED OUTCOMES</text><text x="28" y="352" class="section-subtitle canvas-text">decision-relevant facts survive the return path</text><text x="28" y="630" class="section-label canvas-text">RESPONSE OWNER</text><text x="28" y="652" class="section-subtitle canvas-text">presentation policy stays at the interface</text><text x="440" y="130" text-anchor="middle" class="connector-label canvas-text">SELECT</text><text x="775" y="130" text-anchor="middle" class="connector-label canvas-text">DECIDE</text><text x="1075" y="130" text-anchor="middle" class="connector-label canvas-text">ACCEPTED</text><text x="812" y="276" text-anchor="middle" class="connector-label canvas-text">REJECTED</text><text x="1272" y="282" text-anchor="middle" class="connector-label canvas-text">RESULT</text><text x="745" y="577" text-anchor="middle" class="connector-label canvas-text">EXPLAIN</text><text x="1108" y="597" text-anchor="middle" class="connector-label canvas-text">RECONCILE</text><text x="176" y="112" class="box-label">EXACT INPUT</text><text x="176" y="139" class="box-title">Preparation start</text><text x="176" y="160" class="box-body">item · task · host · TTL</text><text x="176" y="186" class="box-meta">PreparationStartCommand</text><text x="486" y="112" class="box-label">LOCKED STATE</text><text x="486" y="139" class="box-title">Select current facts</text><text x="486" y="160" class="box-body">definition · claim · dependencies</text><text x="486" y="186" class="box-meta">application-owned read</text><text x="826" y="112" class="box-label">PURE DECISION</text><text x="826" y="139" class="box-title">Accept or reject</text><text x="826" y="160" class="box-body">no I/O · no presentation</text><text x="826" y="186" class="box-meta">DecisionResult[T]</text><text x="1126" y="112" class="box-label">ATTEMPTED EFFECT</text><text x="1126" y="139" class="box-title">Commit accepted change</text><text x="1126" y="160" class="box-body">transaction or infrastructure stop</text><text x="1126" y="186" class="box-meta">SQLiteWorkStore.write</text><text x="536" y="382" class="box-label">EXPECTED REJECTION</text><text x="536" y="409" class="box-title">Preserve decision facts</text><text x="536" y="430" class="box-body">observations · mismatches</text><text x="536" y="451" class="box-body">effect: unchanged · retry</text><text x="536" y="472" class="box-body">bounded alternatives</text><text x="536" y="526" class="box-meta">DecisionFailure · FailureDetails</text><text x="1056" y="382" class="box-label">EFFECT OUTCOME</text><text x="1056" y="409" class="box-title">Preserve durable truth</text><text x="1056" y="430" class="box-body">committed claim on success</text><text x="1056" y="451" class="box-body">or changed surfaces + retry</text><text x="1056" y="472" class="box-body">view warning keeps the commit</text><text x="1056" y="526" class="box-meta">effect + changed_surfaces</text><text x="661" y="682" class="box-label">INTERFACE OWNER</text><text x="661" y="709" class="box-title">Explain and choose the next move</text><text x="661" y="730" class="box-body">what happened · whether state changed</text><text x="661" y="751" class="box-body">bounded command or legal action</text><text x="661" y="776" class="box-meta">presentation policy stays here</text><text x="700" y="805" text-anchor="middle" font-size="12" class="note canvas-text">Layers narrow each decision without erasing facts that the next owner needs.</text>
