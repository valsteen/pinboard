<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1400 820">
  <title id="title">Exact operation outcomes become actionable guidance</title>
  <desc id="description">A preparation start carries exact input and selected current state into a pure decision. An expected rejection preserves observations, mismatches, unchanged effect, retry disposition, and legal alternatives. An accepted decision attempts the SQLite effect and returns the committed claim or structured failure facts. The interface explains what happened, whether state changed, and the bounded next action.</desc>
