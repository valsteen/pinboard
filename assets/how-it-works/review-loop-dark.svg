<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1400 800">
  <title id="title">One accepted target anchors an ordinary implementation and review loop</title>
  <desc id="description">On the left, an ordinary coding harness repeatedly interprets a prose request, repository code, and review feedback. On the right, Pinboard preserves accepted semantics and stable authorities, derives concrete impact from the candidate, and binds that candidate plus caller-selected historical evidence into a read-only review job. The independent reviewer reuses unchanged evidence, revalidates changed or unclassified relationships, and widens on concrete escalation conditions. Covered completion preserves accepted checkpoint dispositions.</desc>
