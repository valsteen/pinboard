  <text x="28" y="44" class="section-label canvas-text">CODING AGENTS ALREADY ITERATE</text><text x="28" y="66" class="section-subtitle canvas-text">available prose + code are interpreted each pass</text><text x="730" y="44" class="section-label canvas-text">PINBOARD ANCHORS THE SAME LOOP</text><text x="730" y="66" class="section-subtitle canvas-text">accepted target + exact candidate + evidence</text><text x="245" y="146" text-anchor="middle" class="connector-label canvas-text">DERIVE</text><text x="500" y="146" text-anchor="middle" class="connector-label canvas-text">INSPECT</text><text x="558" y="312" text-anchor="middle" class="connector-label canvas-text">FEEDBACK</text><text x="426" y="248" text-anchor="middle" class="connector-label canvas-text">REVISE</text><text x="928" y="256" text-anchor="middle" class="connector-label canvas-text">SAME TARGET</text><text x="1245" y="136" text-anchor="middle" class="connector-label canvas-text">SAME TARGET</text><text x="1025" y="336" text-anchor="middle" class="connector-label canvas-text">SUBMIT</text><text x="1240" y="466" text-anchor="middle" class="connector-label canvas-text">INSPECT</text><text x="1012" y="688" text-anchor="middle" class="connector-label canvas-text">CORRECT AGAINST BRIEF</text><text x="66" y="132" class="box-label">STARTING CONTEXT</text><text x="66" y="159" class="box-title">Prose request</text><text x="66" y="180" class="box-body">human intent in words</text><text x="66" y="196" class="box-meta">coding-agent input</text><text x="276" y="132" class="box-label">IMPLEMENTATION PASS</text><text x="276" y="159" class="box-title">Derive code</text><text x="276" y="180" class="box-body">interpret prose + repository</text><text x="276" y="196" class="box-meta">LLM judgment</text><text x="526" y="132" class="box-label">REVIEW PASS</text><text x="526" y="159" class="box-title">Inspect result</text><text x="526" y="180" class="box-body">interpret request + diff</text><text x="526" y="196" class="box-meta">LLM judgment</text><text x="296" y="362" class="box-label">REVIEW FEEDBACK</text><text x="296" y="389" class="box-title">Revise the result</text><text x="296" y="410" class="box-body">findings become new prose</text><text x="296" y="431" class="box-body">then implement another pass</text><text x="296" y="446" class="box-meta">ordinary harness loop</text><text x="836" y="112" class="box-label">ACCEPTED TARGET</text><text x="836" y="139" class="box-title">Structured work brief</text><text x="836" y="160" class="box-body">intent · scope · non-goals</text><text x="836" y="181" class="box-body">stable owners · uncertainty</text><text x="836" y="196" class="box-meta">pinboard-work-brief/v2</text><text x="766" y="312" class="box-label">IMPLEMENTER</text><text x="766" y="339" class="box-title">Derive changed surface</text><text x="766" y="360" class="box-body">reread the accepted target</text><text x="766" y="381" class="box-body">read outward when exposed</text><text x="766" y="396" class="box-meta">attempt identity</text><text x="1066" y="312" class="box-label">READ-ONLY REVIEW JOB</text><text x="1066" y="339" class="box-title">Current + prior evidence</text><text x="1066" y="360" class="box-body">exact revision + result digest</text><text x="1066" y="381" class="box-body">selected package + correction</text><text x="1066" y="396" class="box-meta">pinboard-review-job/v2</text><text x="1066" y="532" class="box-label">INDEPENDENT REVIEWER</text><text x="1066" y="559" class="box-title">Classify, reuse, or widen</text><text x="1066" y="580" class="box-body">changed + unclassified surfaces</text><text x="1066" y="601" class="box-body">reuse unchanged · widen on trigger</text><text x="1066" y="616" class="box-meta">completion package when covered</text><text x="350" y="535" text-anchor="middle" font-size="12" class="note-meta canvas-text">WITHOUT AN EXTERNALIZED TARGET, USEFUL FEEDBACK CAN QUIETLY BECOME NEW SCOPE</text><text x="1050" y="745" text-anchor="middle" font-size="12" class="note-meta canvas-text">CHANGED OR UNCERTAIN RELATIONSHIPS DRIVE THE ASSURANCE SURFACE</text><text x="1050" y="763" text-anchor="middle" font-size="12" class="note-meta canvas-text">THEY DO NOT MAKE MODEL JUDGMENT INFALLIBLE OR GUARANTEE CONVERGENCE</text>
</svg>
