  <text x="28" y="42" class="section-label canvas-text">BEFORE IMPLEMENTATION</text><text x="28" y="64" class="section-subtitle canvas-text">one accepted direction becomes an inspectable brief</text><text x="28" y="420" class="section-label canvas-text">AFTER IMPLEMENTATION</text><text x="28" y="442" class="section-subtitle canvas-text">prepare the evidence, then commission the independent review</text><text x="800" y="201" text-anchor="middle" class="connector-label canvas-text">READY</text><text x="600" y="96" text-anchor="middle" class="connector-label canvas-text">LOCAL CHECKPOINT · NO SEPARATE BRIEF REVIEW</text><text x="380" y="322" text-anchor="middle" class="connector-label canvas-text">CORRECT BRIEF · REPUBLISH · RECHECK</text><text x="1055" y="365" text-anchor="middle" class="connector-label canvas-text">SUBMIT CANDIDATE</text><text x="400" y="533" text-anchor="middle" class="connector-label canvas-text">READY</text><text x="700" y="366" text-anchor="middle" class="connector-label canvas-text">CORRECT IMPLEMENTATION</text><text x="76" y="172" class="box-label">ACCEPTED DIRECTION</text><text x="76" y="199" class="box-title">Publish structured brief</text><text x="76" y="220" class="box-body">outcome · scope · verification</text><text x="76" y="241" class="box-body">authorities for cross-boundary work</text><text x="76" y="271" class="box-meta">pinboard-work-brief/v2</text><text x="456" y="172" class="box-label">CROSS-BOUNDARY WORK</text><text x="456" y="199" class="box-title">Independent brief review</text><text x="456" y="220" class="box-body">challenge scope and source roles</text><text x="456" y="241" class="box-body">check contracts and evidence</text><text x="456" y="271" class="box-meta">ready evidence binds checkpoint</text><text x="856" y="172" class="box-label">IMPLEMENTATION</text><text x="856" y="199" class="box-title">Build and verify</text><text x="856" y="220" class="box-body">follow the accepted brief</text><text x="856" y="241" class="box-body">record candidate and result</text><text x="856" y="271" class="box-meta">same attempt through correction</text><text x="856" y="502" class="box-label">REVIEW PREPARATION</text><text x="856" y="529" class="box-title">Bind candidate + evidence</text><text x="856" y="550" class="box-body">brief · result · selected history</text><text x="856" y="571" class="box-body">publish exact reviewer prompt</text><text x="856" y="606" class="box-meta">pinboard-review-job/v4</text><text x="456" y="502" class="box-label">IMPLEMENTATION REVIEW</text><text x="456" y="529" class="box-title">Independent reviewer</text><text x="456" y="550" class="box-body">inspect the candidate against brief</text><text x="456" y="571" class="box-body">reuse evidence or revalidate it</text><text x="456" y="606" class="box-meta">widen on changed relationships</text><text x="76" y="502" class="box-label">OUTCOME OWNER</text><text x="76" y="529" class="box-title">Apply the reviewed result</text><text x="76" y="550" class="box-body">accept checkpoint → pause</text><text x="76" y="571" class="box-body">accept + continue · complete</text><text x="76" y="606" class="box-meta">human owns repository disposition</text><text x="600" y="675" text-anchor="middle" font-size="12" class="note-meta canvas-text">LOCAL WORK STILL RECEIVES INDEPENDENT IMPLEMENTATION REVIEW</text><text x="600" y="703" text-anchor="middle" font-size="12" class="note canvas-text">Prepared context fixes the evidence to inspect; it does not review or accept the candidate.</text><text x="600" y="725" text-anchor="middle" font-size="12" class="note canvas-text">The accepted brief anchors both reviews. Model judgment can still be wrong.</text>
</svg>
