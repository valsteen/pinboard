<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 750">
  <title id="title">Review the intended work, then review its implementation</title>
  <desc id="description">A published brief receives independent review and bounded corrections before cross-boundary implementation. Local checkpoints skip the separate brief review. After implementation, the exact candidate and evidence are bound with selected checkpoint or correction evidence into context for a separate implementation reviewer. Implementation defects return to the same attempt for correction; brief gaps and product decisions return to their owner. A favorable review informs the outcome owner&#x27;s acceptance decision. Review preparation may publish a prompt but leaves the protected candidate and lifecycle unchanged.</desc>
