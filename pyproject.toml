[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "pinboard"
version = "0.1.0"
description = "Validated coordination for one repository-owned work ledger"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "msgspec>=0.21.1",
]

[project.scripts]
pinboard = "pinboard.interfaces.cli:main"

[tool.uv]
required-version = "==0.12.10"

[tool.uv.build-backend]
module-name = "pinboard"
source-exclude = [".DS_Store"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests", "docs/how_it_works", "codegen"]

[tool.ruff.lint]
extend-select = ["ICN003", "RUF100"]
select = ["ANN", "ARG", "B", "BLE", "C4", "C90", "E4", "E7", "E9", "F", "I", "PERF", "PGH", "PIE", "PLC0415", "PLR0912", "PLR0915", "PTH", "RET", "RUF", "SIM", "T10", "TID", "UP", "W"]
ignore = ["BLE001"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = [
    "pinboard.application.query_models",
    "pinboard.application.stored_state",
    "pinboard.domain.authority_models",
    "pinboard.domain.decision_models",
    "pinboard.domain.work_models",
    "pinboard.interfaces.cli_commands",
    "pinboard.interfaces.transition_models",
    "pinboard.interfaces.work_brief_models",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"enum.StrEnum".msg = "Use Enum so string behavior remains explicit."
"src".msg = "Import the installed package as pinboard; src is only the source-tree layout."
"typing.Any".msg = "Use a concrete type or a closed union."
"typing.cast".msg = "Narrow values explicitly instead of overriding the type checker."
"typing_extensions.cast".msg = "Narrow values explicitly instead of overriding the type checker."

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["pinboard", "tests"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src", "tests", "docs/how_it_works", "codegen"]
search-path = ["."]
preset = "strict"
min-severity = "warn"

[tool.pyrefly.errors]
invalid-cast = "error"
no-any-return = "error"

[[tool.pyrefly.sub-config]]
matches = "src/**"

[tool.pyrefly.sub-config.errors]
unknown-argument-type = "warn"
unknown-attribute-type = "warn"
unknown-variable-type = "warn"

[tool.coverage.run]
branch = true
source = ["pinboard"]

[tool.coverage.report]
exclude_also = [
    "case _ as unreachable:",
]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "coverage>=7.10.4",
    "pyyaml>=6.0.3",
    "pyrefly>=1.2.0",
    "ruff>=0.16.3",
]
