[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "pinboard"
version = "0.1.0"
description = "Validated coordination for one repository-owned work ledger"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "anyio>=4.15.1",
    "mcp==2.2.0",
    "msgspec>=0.21.1",
]

[project.scripts]
pinboard = "pinboard.cli.entrypoint:main"
pinboard-mcp = "pinboard.mcp.server:main"
pinboard-claude-subagent-start = "pinboard.claude_hook:main"
pinboard-claude-session-start = "pinboard.claude_hook:session_start_main"
pinboard-claude-pre-tool-use = "pinboard.claude_hook:pre_tool_use_main"
pinboard-antigravity-session-start = "pinboard.antigravity_hook:session_start_main"
pinboard-antigravity-pre-tool-use = "pinboard.antigravity_hook:pre_tool_use_main"

[tool.uv]
required-version = "==0.13.6"

[tool.uv.build-backend]
module-name = "pinboard"
source-exclude = [".DS_Store"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests", "docs/how_it_works", "evals"]

[tool.ruff.lint]
extend-select = ["ICN003", "RUF100"]
select = ["ANN", "ARG", "B", "BLE", "C4", "C90", "E4", "E7", "E9", "F", "I", "PERF", "PGH", "PIE", "PLC0415", "PLR0912", "PLR0915", "PTH", "RET", "RUF", "SIM", "T10", "TID", "UP", "W"]
ignore = ["BLE001"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = [
    "pinboard.application.query_models",
    "pinboard.application.stored_state",
    "pinboard.domain.authority_models",
    "pinboard.domain.decision_models",
    "pinboard.domain.work_models",
    "pinboard.cli.cli_commands",
    "pinboard.application.work_brief_models",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"enum.StrEnum".msg = "Use Enum so string behavior remains explicit."
"src".msg = "Import the installed package as pinboard; src is only the source-tree layout."
"typing.Any".msg = "Use a concrete type or a closed union."
"typing.cast".msg = "Narrow values explicitly instead of overriding the type checker."
"typing_extensions.cast".msg = "Narrow values explicitly instead of overriding the type checker."

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["pinboard", "tests", "evals"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src", "tests", "docs/how_it_works", "scripts/check_duplication.py", "scripts/verify.py", "evals"]
search-path = ["."]
preset = "strict"
min-severity = "warn"
type-ignore-unknown-tag-behavior = "no-effect"

[tool.pyrefly.errors]
invalid-cast = "error"
no-any-return = "error"
unknown-return-type = "error"
untyped-function-decorator = "error"
untyped-class-decorator = "error"
untyped-namedtuple = "error"

[[tool.pyrefly.sub-config]]
matches = "src/**"

[tool.pyrefly.sub-config.errors]
unknown-argument-type = "warn"
unknown-attribute-type = "warn"
unknown-variable-type = "warn"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "docs/how_it_works", "scripts/check_duplication.py", "scripts/verify.py", "evals"]
respect-ignore-files = false

[tool.ty.rules]
all = "error"
# Optional soundness rules reject Any/Unknown from library typing and inference.
# https://docs.astral.sh/ty/reference/rules/#unsound-assignment
# https://docs.astral.sh/ty/reference/rules/#unsound-return-statement
# https://docs.astral.sh/ty/reference/rules/#unsound-yield
# msgspec schema typing: https://github.com/msgspec/msgspec/issues/682
# ty empty collection inference: https://github.com/astral-sh/ty/issues/4697
# ty empty frozenset inference: https://github.com/astral-sh/ty/issues/4294
# shortcut: optional soundness checks stay off; reconsider when upstream typing
# and inference can express the existing validated boundaries without duplicate validation.
# Opt in by replacing the corresponding ignore values with these error values:
# unsound-assignment = "error"
# unsound-return-statement = "error"
# unsound-yield = "error"
unsound-assignment = "ignore"
unsound-return-statement = "ignore"
unsound-yield = "ignore"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
branch = true
source = ["pinboard"]

[tool.coverage.report]
exclude_also = [
    "case _ as unreachable:",
]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "coverage>=7.10.4",
    "mcp-types>=2.2.0",
    "pyyaml>=6.0.3",
    "pyrefly>=1.4.0",
    "ruff>=0.16.3",
    "ty>=0.0.90",
]
